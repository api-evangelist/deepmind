aid: deepmind
name: DeepMind
description: >-
  Google DeepMind is an artificial intelligence research laboratory and product
  organization behind the Gemini and Gemma foundation model families, the
  AlphaFold protein-structure prediction system, WeatherNext atmospheric
  forecasting, and Gemini Robotics. Founded in London and now part of Google,
  DeepMind combines frontier AI research with public and developer-facing model
  deployment. Its models are exposed to developers through the Google AI /
  Gemini API and Google AI Studio, while its research tooling ships as
  first-party open-source JAX libraries (Haiku, Optax, Chex, dm-control, and
  more) on GitHub and PyPI. Originally an independent startup backed by early
  investors including Founders Fund before its acquisition by Google.
